<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#22c55e">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>آفلاین — MOGHAREH360</title>
  <style>
    :root {
      --bg: #0f1714;
      --card: #1c2b24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: radial-gradient(ellipse at top, #1a2e26 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    .shell {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.2rem; }
    p { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; }
    .note {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      background: var(--accent);
      color: #052e16;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="shell" role="main">
    <h1>اتصال برقرار نیست</h1>
    <p>برای ادامه کار با سامانه، به اینترنت متصل شوید و دوباره تلاش کنید.</p>
    <p class="note">صفحات عملیاتی، فاکتور، پروفایل و داده‌های حساس به‌صورت آفلاین ذخیره نمی‌شوند.</p>
    <a class="btn" href="./">بازگشت به صفحه اصلی</a>
  </main>
</body>
</html>
